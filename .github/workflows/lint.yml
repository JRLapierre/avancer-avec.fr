name: Code quality check

on: [push]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Cloning the code
        uses: actions/checkout@v5

      - name: Install Node
        uses: actions/setup-node@v5
        with:
          node-version: '22.17.1'

      - name: Install dependencies
        run: npm ci

      - name: Execute linting
        run: npm run lint